<!DOCTYPE html>
<html lang="de">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --bg:        #fffaf5;
      --surface:   #fff8f0;
      --card:      #ffffff;
      --border:    #f0e8de;
      --accent:    #d97b4a;
      --accent-bg: #fdf0e8;
      --text:      #2d2010;
      --muted:     #8a7060;
      --hint:      #b8a898;
      --radius:    18px;
      --shadow:    0 2px 12px rgba(180,120,60,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #1a1410;
        --surface:   #221c16;
        --card:      #2a221a;
        --border:    #3d3028;
        --accent:    #e8925f;
        --accent-bg: #2d1f14;
        --text:      #f5ede4;
        --muted:     #a89080;
        --hint:      #6a5a50;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .view { display: none; padding: 1.25rem 1rem 2rem; max-width: 480px; margin: 0 auto; }
    .view.active { display: block; }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 8px;
    }
    .app-header h1   { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .app-header .sub { font-size: 14px; color: var(--muted); margin-top: 3px; }

    .lang-switcher { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
    .lang-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 4px 7px;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: border-color 0.12s, transform 0.1s;
    }
    .lang-btn:active { transform: scale(0.93); }
    .lang-btn.active { border-color: var(--accent); background: var(--accent-bg); }

    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-wrap input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--hint); }
    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--hint); font-size: 17px; pointer-events: none;
    }

    .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .guide-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeUp 0.3s ease both;
    }
    .guide-card:active { transform: scale(0.97); }
    .guide-card:hover  { border-color: var(--accent); box-shadow: 0 4px 20px rgba(180,120,60,0.13); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-emoji { font-size: 30px; line-height: 1; }
    .card-name  { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .card-meta  { font-size: 12px; color: var(--muted); }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 15px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 0 0 1.25rem;
    }

    .detail-hero {
      background: var(--accent-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .detail-emoji { font-size: 44px; flex-shrink: 0; }
    .detail-title { font-size: 20px; font-weight: 700; }
    .detail-desc  { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .device-info  {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .device-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .section-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hint);
      margin-bottom: 0.75rem;
    }

    .mode-list { display: flex; flex-direction: column; gap: 10px; }

    .mode-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.12s, border-color 0.12s;
      animation: fadeUp 0.25s ease both;
    }
    .mode-card:active { transform: scale(0.97); }
    .mode-card:hover  { border-color: var(--accent); }
    .mode-icon  { font-size: 26px; flex-shrink: 0; }
    .mode-name  { font-size: 16px; font-weight: 700; }
    .mode-arrow { margin-left: auto; color: var(--hint); font-size: 18px; }

    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 0.85rem;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      box-shadow: var(--shadow);
      animation: fadeUp 0.25s ease both;
    }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-body { flex: 1; }
    .step-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
    .step-note {
      font-size: 13px; color: var(--muted); line-height: 1.5;
      background: var(--accent-bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 5px 8px; margin-top: 6px;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1rem;
      margin-bottom: 1rem;
      padding: 10px 16px;
      background: var(--card);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      justify-content: center;
    }
    .download-btn:active { transform: scale(0.97); }

    .download-icon { font-size: 16px; }

    .step-photo { margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); }

    .photo-placeholder {
      background: var(--surface); height: 110px;
      display: flex; align-items: center; justify-content: center;
      color: var(--hint); font-size: 13px; gap: 6px;
    }

</head>

/* ══════════════════════════════════════════════════════
   APP-LOGIK — hier musst du nichts ändern
══════════════════════════════════════════════════════ */
let lang = localStorage.getItem('lang') || 'de';
let currentGuide = null;

function t(obj) {
  if (!obj) return '';
  return obj[lang] || obj['de'] || '';
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = l;

  ['de','es','en'].forEach(code => {
    document.getElementById('btn-' + code).classList.toggle('active', code === l);
  });

  const ui = UI[l];
  document.getElementById('homeTitle').textContent        = ui.appTitle;
  document.getElementById('homeSub').textContent          = ui.appSub;
  document.getElementById('searchInput').placeholder      = ui.searchPlaceholder;
  document.getElementById('modesBack').textContent        = ui.back;
  document.getElementById('stepsBack').textContent        = ui.back;
  document.getElementById('modesHeading').textContent     = ui.modesHeading;
  document.getElementById('stepsHeading').textContent     = ui.stepsHeading;

  const active = document.querySelector('.view.active').id;
  if (active === 'homeView') {
    renderGrid(GUIDES);
  } else if (active === 'modesView' && currentGuide) {
    openGuide(currentGuide.name['de']);
  }
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderGrid(data) {
  const ui   = UI[lang];
  const grid = document.getElementById('guideGrid');
  if (data.length === 0) {
    grid.innerHTML = `<div class="no-results">${ui.noResults}</div>`;
    return;
  }
  grid.innerHTML = data.map((g, i) => `
    <div class="guide-card" style="animation-delay:${i * 0.05}s"
         onclick="openGuide('${g.name['de']}')">
      <div class="card-emoji">${g.icon}</div>
      <div class="card-name">${t(g.name)}</div>
      <div class="card-meta">
        ${g.modes
          ? g.modes.length + ' ' + ui.functions
          : g.steps.length + ' ' + ui.steps}
      </div>
    </div>
  `).join('');
}

function filterGuides(q) {
  const filtered = GUIDES.filter(g =>
    t(g.name).toLowerCase().includes(q.toLowerCase())
  );
  renderGrid(filtered);
}

function renderDevice(device) {
  if (!device) return '';
  const tags = [
    device.brand  ? `🏷 ${device.brand}`  : null,
    device.model  ? `📦 ${device.model}`  : null,
    device.number ? `🔢 ${device.number}` : null,
  ].filter(Boolean);
  return tags.map(tag => `<span class="device-tag">${tag}</span>`).join('');
}

function openGuide(deName) {
  const g = GUIDES.find(x => x.name['de'] === deName);
  if (!g) return;
  currentGuide = g;

  if (g.modes) {
    document.getElementById('modesEmoji').textContent   = g.icon;
    document.getElementById('modesTitle').textContent   = t(g.name);
    document.getElementById('modesDesc').textContent    = t(g.desc);
    document.getElementById('modesDevice').innerHTML    = renderDevice(g.device);
    document.getElementById('modesHeading').textContent = UI[lang].modesHeading;
    document.getElementById('modesManual').innerHTML = g.manual
      ? `<a class="download-btn" href="${g.manual}" download>
           <span class="download-icon">📄</span>${UI[lang].downloadManual}
         </a>`
      : '';
    document.getElementById('modeList').innerHTML = g.modes.map((m, i) => `
      <div class="mode-card" style="animation-delay:${i * 0.07}s"
           onclick="openMode(${i})">
        <div class="mode-icon">${m.icon}</div>
        <div class="mode-name">${t(m.name)}</div>
        <div class="mode-arrow">›</div>
      </div>
    `).join('');
    showView('modesView');
  } else {
    renderSteps(g.icon, t(g.name), t(g.desc), g.steps, 'home');
  }
}

function openMode(index) {
  const m = currentGuide.modes[index];
  renderSteps(m.icon, t(m.name), '', m.steps, 'modes');
}

function renderSteps(icon, title, desc, steps, backTarget) {
  const ui = UI[lang];
  document.getElementById('stepsEmoji').textContent   = icon;
  document.getElementById('stepsTitle').textContent   = title;
  document.getElementById('stepsDesc').textContent    = desc;
  document.getElementById('stepsDevice').innerHTML    = renderDevice(currentGuide ? currentGuide.device : null);
  document.getElementById('stepsHeading').textContent = ui.stepsHeading;
  document.getElementById('stepsBack').textContent    = ui.back;

  const manual = currentGuide ? currentGuide.manual : null;
  document.getElementById('stepsManual').innerHTML = manual
    ? `<a class="download-btn" href="${manual}" download>
         <span class="download-icon">📄</span>${ui.downloadManual}
       </a>`
    : '';

  document.getElementById('stepsBackBtn').onclick =
    backTarget === 'modes' ? showModes : showHome;

  document.getElementById('stepsList').innerHTML = steps.map((s, i) => `
    <div class="step" style="animation-delay:${i * 0.06}s">
      <div class="step-num">${i + 1}</div>
      <div class="step-body">
        <div class="step-text">${t(s.text)}</div>
        ${t(s.note) ? `<div class="step-note">💡 ${t(s.note)}</div>` : ''}
        ${s.photo
          ? `<div class="step-photo"><img src="${s.photo}" alt="Foto ${i+1}" /></div>`
          : `<div class="step-photo"><div class="photo-placeholder">${ui.photoLabel}</div></div>`
        }
      </div>
    </div>
  `).join('');

  showView('stepsView');
}

function showHome() {
  currentGuide = null;
  document.getElementById('searchInput').value = '';
  renderGrid(GUIDES);
  showView('homeView');
}

function showModes() { showView('modesView'); }

setLang(lang);
</script>
</body>
</html>
