<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mamas Helfer</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#fffaf5" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #fffaf5;
      --surface:   #fff8f0;
      --card:      #ffffff;
      --border:    #f0e8de;
      --accent:    #d97b4a;
      --accent-bg: #fdf0e8;
      --text:      #2d2010;
      --muted:     #8a7060;
      --hint:      #b8a898;
      --radius:    18px;
      --shadow:    0 2px 12px rgba(180,120,60,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #000000;
        --surface:   #0a0806;
        --card:      #0f0b08;
        --border:    #ff6020;
        --accent:    #ff7030;
        --accent-bg: #1a0e04;
        --text:      #fff8f2;
        --muted:     #c8a888;
        --hint:      #806858;
        --shadow:    0 2px 12px rgba(255,100,30,0.12);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .view { display: none; padding: 1.25rem 1rem 2rem; max-width: 480px; margin: 0 auto; }
    .view.active { display: block; }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 8px;
    }
    .app-header h1   { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .app-header .sub { font-size: 14px; color: var(--muted); margin-top: 3px; }

    .lang-switcher { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
    .lang-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 4px 7px;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: border-color 0.12s, transform 0.1s;
    }
    .lang-btn:active { transform: scale(0.93); }
    .lang-btn.active { border-color: var(--accent); background: var(--accent-bg); }

    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-wrap input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--hint); }
    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--hint); font-size: 17px; pointer-events: none;
    }

    .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .guide-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeUp 0.3s ease both;
    }
    .guide-card:active { transform: scale(0.97); }
    .guide-card:hover  { border-color: var(--accent); box-shadow: 0 4px 20px rgba(180,120,60,0.13); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-emoji { font-size: 30px; line-height: 1; }
    .card-name  { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .card-meta  { font-size: 12px; color: var(--muted); }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 15px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent);
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 0 0 1.25rem;
    }

    .detail-hero {
      background: var(--accent-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .detail-emoji { font-size: 44px; flex-shrink: 0; }
    .detail-title { font-size: 20px; font-weight: 700; }
    .detail-desc  { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .device-info  {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .device-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .section-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hint);
      margin-bottom: 0.75rem;
    }

    .mode-list { display: flex; flex-direction: column; gap: 10px; }

    .mode-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.12s, border-color 0.12s;
      animation: fadeUp 0.25s ease both;
    }
    .mode-card:active { transform: scale(0.97); }
    .mode-card:hover  { border-color: var(--accent); }
    .mode-icon  { font-size: 26px; flex-shrink: 0; }
    .mode-body  { flex: 1; min-width: 0; }
    .mode-name  { font-size: 16px; font-weight: 700; }
    .mode-arrow { margin-left: auto; color: var(--hint); font-size: 18px; flex-shrink: 0; }
    .mode-app-info { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
    .mode-app-info img { width: 15px; height: 15px; object-fit: contain; border-radius: 3px; }
    .mode-app-name { font-size: 12px; color: var(--muted); }

    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 0.85rem;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      box-shadow: var(--shadow);
      animation: fadeUp 0.25s ease both;
    }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-body { flex: 1; }
    .step-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
    .step-note {
      font-size: 13px; color: var(--muted); line-height: 1.5;
      background: var(--accent-bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 5px 8px; margin-top: 6px;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1rem;
      margin-bottom: 1rem;
      padding: 10px 16px;
      background: var(--card);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      width: 100%;
      justify-content: center;
    }
    .download-btn:active { transform: scale(0.97); }
    .download-btn:hover  { background: var(--accent-bg); }
    .download-icon { font-size: 16px; }

    .step-photo { margin-top: 8px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); }
    .step-photo img { width: 100%; display: block; max-height: 200px; object-fit: cover; }
    .photo-placeholder {
      background: var(--surface); height: 110px;
      display: flex; align-items: center; justify-content: center;
      color: var(--hint); font-size: 13px; gap: 6px;
    }

    /* ── Admin ───────────────────────────────────── */
    .admin-fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none; cursor: pointer;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(180,120,60,0.3);
      transition: transform 0.15s;
      z-index: 100;
    }
    .admin-fab:active { transform: scale(0.92); }

    #adminView { background: var(--bg); }
    #adminView .view-inner { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 6rem; }

    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .admin-header h2 { font-size: 22px; font-weight: 700; }

    .admin-section {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }
    .admin-section-title {
      font-size: 12px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--hint); margin-bottom: 0.75rem;
    }

    .admin-field { margin-bottom: 0.75rem; }
    .admin-field label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--muted); margin-bottom: 4px;
    }
    .admin-field input, .admin-field textarea, .admin-field select {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }
    .admin-field input:focus, .admin-field textarea:focus { border-color: var(--accent); }

    .admin-step {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem;
      margin-bottom: 0.6rem;
      position: relative;
    }
    .admin-step-num {
      font-size: 11px; font-weight: 700; color: var(--hint);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .admin-mode {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem;
      margin-bottom: 0.75rem;
    }
    .admin-mode-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .admin-mode-title { font-size: 14px; font-weight: 700; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem; }
    .btn-sm {
      padding: 7px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .btn-sm:hover { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
    .btn-sm.danger { color: #c0392b; border-color: #f5c6c6; }
    .btn-sm.danger:hover { background: #fff0f0; border-color: #e74c3c; }
    .btn-sm.primary {
      background: var(--accent); color: #fff;
      border-color: var(--accent);
    }
    .btn-sm.primary:hover { opacity: 0.9; }

    .admin-guide-list { display: flex; flex-direction: column; gap: 8px; }
    .admin-guide-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .admin-guide-item:hover { border-color: var(--accent); }
    .admin-guide-item-emoji { font-size: 22px; }
    .admin-guide-item-name  { font-size: 14px; font-weight: 700; flex: 1; }
    .admin-guide-item-arrow { color: var(--hint); }

    .token-status {
      font-size: 12px; padding: 4px 10px;
      border-radius: 20px; font-weight: 700;
    }
    .token-status.ok  { background: #e8f8f0; color: #1a7a4a; }
    .token-status.nok { background: #fff0f0; color: #c0392b; }

    .push-status {
      margin-top: 0.75rem; font-size: 13px; font-weight: 600;
      padding: 10px 14px; border-radius: 12px; display: none;
    }
    .push-status.success { background: #e8f8f0; color: #1a7a4a; display: block; }
    .push-status.error   { background: #fff0f0; color: #c0392b; display: block; }
    .push-status.loading { background: var(--accent-bg); color: var(--accent); display: block; }

    .collapsible-steps { display: none; margin-top: 0.75rem; }
    .collapsible-steps.open { display: block; }
  </style>
</head>
<body>

<!-- Admin FAB -->
<button class="admin-fab" onclick="showAdmin()" title="Admin">⚙️</button>

<!-- VIEW ADMIN -->
<div id="adminView" style="display:none; position:fixed; inset:0; overflow-y:auto; z-index:200;">
  <div class="view-inner">

    <div class="admin-header">
      <h2>⚙️ Admin</h2>
      <button class="btn-sm" onclick="closeAdmin()">✕ Schließen</button>
    </div>

    <!-- GitHub Token -->
    <div class="admin-section">
      <div class="admin-section-title">GitHub Verbindung</div>
      <div class="admin-field">
        <label>Personal Access Token</label>
        <input type="password" id="ghToken" placeholder="ghp_..." oninput="saveToken()" />
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:4px;">
        <span id="tokenStatus" class="token-status nok">Nicht gesetzt</span>
        <span style="font-size:12px; color:var(--hint);">mettbroetchen / mamanual</span>
      </div>
    </div>

    <!-- Geräteliste -->
    <div class="admin-section">
      <div class="admin-section-title">Geräte</div>
      <div class="admin-guide-list" id="adminGuideList"></div>
      <div class="btn-row" style="margin-top:0.75rem;">
        <button class="btn-sm primary" onclick="adminNewGuide()">+ Neues Gerät</button>
      </div>
    </div>

    <!-- Gerät-Editor (wird dynamisch befüllt) -->
    <div id="adminGuideEditor" style="display:none;">
      <div class="admin-section">
        <div class="admin-section-title" id="adminEditorTitle">Gerät bearbeiten</div>

        <div style="display:flex; gap:8px;">
          <div class="admin-field" style="width:70px; flex-shrink:0;">
            <label>Icon</label>
            <input type="text" id="editIcon" maxlength="2" />
          </div>
          <div class="admin-field" style="flex:1;">
            <label>Name (DE)</label>
            <input type="text" id="editNameDe" />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <div class="admin-field" style="flex:1;">
            <label>Name (ES)</label>
            <input type="text" id="editNameEs" />
          </div>
          <div class="admin-field" style="flex:1;">
            <label>Name (EN)</label>
            <input type="text" id="editNameEn" />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <div class="admin-field" style="flex:1;">
            <label>Beschreibung (DE)</label>
            <input type="text" id="editDescDe" />
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <div class="admin-field" style="flex:1;">
            <label>Beschreibung (ES)</label>
            <input type="text" id="editDescEs" />
          </div>
          <div class="admin-field" style="flex:1;">
            <label>Beschreibung (EN)</label>
            <input type="text" id="editDescEn" />
          </div>
        </div>

        <!-- Gerätedetails -->
        <div class="admin-section-title" style="margin-top:0.5rem;">Gerätedetails (optional)</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <div class="admin-field" style="flex:1; min-width:120px;">
            <label>Marke</label>
            <input type="text" id="editBrand" />
          </div>
          <div class="admin-field" style="flex:1; min-width:120px;">
            <label>Modell</label>
            <input type="text" id="editModel" />
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <div class="admin-field" style="flex:1; min-width:120px;">
            <label>Modellnummer</label>
            <input type="text" id="editNumber" />
          </div>
          <div class="admin-field" style="flex:1; min-width:120px;">
            <label>Betriebssystem</label>
            <input type="text" id="editOs" />
          </div>
        </div>
        <div class="admin-field">
          <label>PDF-Anleitung (Pfad, z.B. manuals/geraet.pdf)</label>
          <input type="text" id="editManual" placeholder="manuals/..." />
        </div>
      </div>

      <!-- Struktur: steps oder modes -->
      <div class="admin-section">
        <div class="admin-section-title">Struktur</div>
        <div class="admin-field">
          <label>Typ</label>
          <select id="editType" onchange="adminToggleType()">
            <option value="steps">Direkte Schritte (kein Zwischenscreen)</option>
            <option value="modes">Unterkategorien (mit Zwischenscreen)</option>
          </select>
        </div>

        <!-- Direkte Schritte -->
        <div id="adminStepsEditor">
          <div id="adminStepsList"></div>
          <button class="btn-sm" onclick="adminAddStep(-1)">+ Schritt hinzufügen</button>
        </div>

        <!-- Modes -->
        <div id="adminModesEditor" style="display:none;">
          <div id="adminModesList"></div>
          <button class="btn-sm" onclick="adminAddMode()">+ Unterkategorie hinzufügen</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-sm primary" onclick="adminSaveGuide()">💾 Speichern & zu GitHub pushen</button>
        <button class="btn-sm danger"  onclick="adminDeleteGuide()">🗑 Gerät löschen</button>
        <button class="btn-sm"         onclick="adminCloseEditor()">Abbrechen</button>
      </div>
      <div id="pushStatus" class="push-status"></div>
    </div>

  </div>
</div>

<!-- VIEW 1 — STARTSEITE -->
<div class="view active" id="homeView">
  <div class="app-header">
    <div>
      <h1 id="homeTitle">Mamas Helfer</h1>
      <p class="sub" id="homeSub">Wie funktioniert das nochmal?</p>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('de')" id="btn-de">🇩🇪</button>
      <button class="lang-btn"        onclick="setLang('es')" id="btn-es">🇪🇸</button>
      <button class="lang-btn"        onclick="setLang('en')" id="btn-en">🇬🇧</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" oninput="filterGuides(this.value)" />
  </div>
  <div class="guide-grid" id="guideGrid"></div>
</div>

<!-- VIEW 2 — UNTERKATEGORIEN -->
<div class="view" id="modesView">
  <button class="back-btn" onclick="showHome()">← <span id="modesBack">Zurück</span></button>
  <div class="detail-hero">
    <div class="detail-emoji" id="modesEmoji"></div>
    <div>
      <div class="detail-title" id="modesTitle"></div>
      <div class="detail-desc"  id="modesDesc"></div>
      <div class="device-info"  id="modesDevice"></div>
    </div>
  </div>
  <div class="section-heading" id="modesHeading"></div>
  <div id="modesManual"></div>
  <div class="mode-list" id="modeList"></div>
</div>

<!-- VIEW 3 — SCHRITTE -->
<div class="view" id="stepsView">
  <button class="back-btn" id="stepsBackBtn">← <span id="stepsBack">Zurück</span></button>
  <div class="detail-hero">
    <div class="detail-emoji" id="stepsEmoji"></div>
    <div>
      <div class="detail-title" id="stepsTitle"></div>
      <div class="detail-desc"  id="stepsDesc"></div>
      <div class="device-info"  id="stepsDevice"></div>
    </div>
  </div>
  <div class="section-heading" id="stepsHeading"></div>
  <div id="stepsManual"></div>
  <div id="stepsList"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   UI-TEXTE — Übersetzungen der App-Oberfläche
══════════════════════════════════════════════════════ */
const UI = {
  de: {
    appTitle:          "Mamas Helfer",
    appSub:            "Wie funktioniert das nochmal?",
    searchPlaceholder: "Gerät suchen...",
    modesHeading:      "Was möchtest du tun?",
    stepsHeading:      "Schritt für Schritt",
    back:              "Zurück",
    noResults:         "Nichts gefunden 🙁",
    steps:             "Schritte",
    functions:         "Funktionen",
    photoLabel:        "📷 Foto folgt",
    downloadManual:    "Bedienungsanleitung herunterladen",
    brand:             "Marke",
    model:             "Modell",
    number:            "Modellnummer",
    os:                "Betriebssystem",
  },
  es: {
    appTitle:          "La Ayudante de Mamá",
    appSub:            "¿Cómo funciona esto?",
    searchPlaceholder: "Buscar dispositivo...",
    modesHeading:      "¿Qué quieres hacer?",
    stepsHeading:      "Paso a paso",

/* ══════════════════════════════════════════════════════
   APP-LOGIK — hier musst du nichts ändern
══════════════════════════════════════════════════════ */
let lang = localStorage.getItem('lang') || 'de';
let currentGuide = null;

function t(obj) {
  if (!obj) return '';
  return obj[lang] || obj['de'] || '';
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = l;

  ['de','es','en'].forEach(code => {
    document.getElementById('btn-' + code).classList.toggle('active', code === l);
  });

  const ui = UI[l];
  document.getElementById('homeTitle').textContent        = ui.appTitle;
  document.getElementById('homeSub').textContent          = ui.appSub;
  document.getElementById('searchInput').placeholder      = ui.searchPlaceholder;
  document.getElementById('modesBack').textContent        = ui.back;
  document.getElementById('stepsBack').textContent        = ui.back;
  document.getElementById('modesHeading').textContent     = ui.modesHeading;
  document.getElementById('stepsHeading').textContent     = ui.stepsHeading;

  const active = document.querySelector('.view.active').id;
  if (active === 'homeView') {
    renderGrid(GUIDES);
  } else if (active === 'modesView' && currentGuide) {
    openGuide(currentGuide.name['de']);
  }
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderGrid(data) {
  const ui   = UI[lang];
  const grid = document.getElementById('guideGrid');
  if (data.length === 0) {
    grid.innerHTML = `<div class="no-results">${ui.noResults}</div>`;
    return;
  }
  grid.innerHTML = data.map((g, i) => `
    <div class="guide-card" style="animation-delay:${i * 0.05}s"
         onclick="openGuide('${g.name['de']}')">
      <div class="card-emoji">${g.icon}</div>
      <div class="card-name">${t(g.name)}</div>
      <div class="card-meta">
        ${g.modes
          ? g.modes.length + ' ' + ui.functions
          : g.steps.length + ' ' + ui.steps}
      </div>
    </div>
  `).join('');
}

function filterGuides(q) {
  if (!q) { renderGrid(GUIDES); return; }
  const lq = q.toLowerCase();
  const filtered = GUIDES.filter(g => {
    if (t(g.name).toLowerCase().includes(lq)) return true;
    if (g.modes) {
      return g.modes.some(m =>
        t(m.name).toLowerCase().includes(lq) ||
        (m.app && m.app.name && m.app.name.toLowerCase().includes(lq))
      );
    }
    return false;
  });
  renderGrid(filtered);
}

function renderDevice(device) {
  if (!device) return '';
  const ui = UI[lang];
  const tags = [
    device.brand  ? `${ui.brand}: ${device.brand}`   : null,
    device.model  ? `${ui.model}: ${device.model}`   : null,
    device.number ? `${ui.number}: ${device.number}` : null,
    device.os     ? `${ui.os}: ${device.os}`         : null,
  ].filter(Boolean);
  return tags.map(tag => `<span class="device-tag">${tag}</span>`).join('');
}

function renderIcon(icon, size) {
  if (!icon) return '❓';
  const isImage = icon.includes('/') || icon.match(/\.(png|jpg|jpeg|svg|webp|gif)$/i);
  if (isImage) {
    const px = size || 32;
    return `<img src="${icon}" alt="icon" style="width:${px}px;height:${px}px;object-fit:contain;border-radius:6px;" />`;
  }
  return icon;
}

function openGuide(deName) {
  const g = GUIDES.find(x => x.name['de'] === deName);
  if (!g) return;
  currentGuide = g;

  if (g.modes) {
    document.getElementById('modesEmoji').innerHTML   = renderIcon(g.icon, 44);
    document.getElementById('modesTitle').textContent   = t(g.name);
    document.getElementById('modesDesc').textContent    = t(g.desc);
    document.getElementById('modesDevice').innerHTML    = renderDevice(g.device);
    document.getElementById('modesHeading').textContent = UI[lang].modesHeading;
    document.getElementById('modesManual').innerHTML = g.manual
      ? `<a class="download-btn" href="${g.manual}" download>
           <span class="download-icon">📄</span>${UI[lang].downloadManual}
         </a>`
      : '';
    document.getElementById('modeList').innerHTML = g.modes.map((m, i) => `
      <div class="mode-card" style="animation-delay:${i * 0.07}s"
           onclick="openMode(${i})">
        <div class="mode-icon">${renderIcon(m.icon, 28)}</div>
        <div class="mode-body">
          <div class="mode-name">${t(m.name)}</div>
          ${m.app ? `<div class="mode-app-info">${m.app.iconUrl ? `<img src="${m.app.iconUrl}" alt="" onerror="this.style.display='none'">` : ''}<span class="mode-app-name">${m.app.name}</span></div>` : ''}
        </div>
        <div class="mode-arrow">›</div>
      </div>
    `).join('');
    showView('modesView');
  } else {
    renderSteps(g.icon, t(g.name), t(g.desc), g.steps, 'home');
  }
}

function openMode(index) {
  const m = currentGuide.modes[index];
  renderSteps(m.icon, t(m.name), '', m.steps, 'modes', m.app || null);
}

function renderSteps(icon, title, desc, steps, backTarget, app) {
  const ui = UI[lang];
  document.getElementById('stepsEmoji').innerHTML   = renderIcon(icon, 44);
  document.getElementById('stepsTitle').textContent   = title;
  document.getElementById('stepsDesc').textContent    = desc;
  if (app) {
    const imgHtml = app.iconUrl
      ? `<img src="${app.iconUrl}" alt="" onerror="this.style.display='none'" style="width:20px;height:20px;object-fit:contain;border-radius:4px;vertical-align:middle;margin-right:4px;">`
      : '';
    document.getElementById('stepsDevice').innerHTML = `<div class="device-info"><span class="device-tag">${imgHtml}${app.name}</span></div>`;
  } else {
    document.getElementById('stepsDevice').innerHTML = renderDevice(currentGuide ? currentGuide.device : null);
  }
  document.getElementById('stepsHeading').textContent = ui.stepsHeading;
  document.getElementById('stepsBack').textContent    = ui.back;

  const manual = currentGuide ? currentGuide.manual : null;
  document.getElementById('stepsManual').innerHTML = manual
    ? `<a class="download-btn" href="${manual}" download>
         <span class="download-icon">📄</span>${ui.downloadManual}
       </a>`
    : '';

  document.getElementById('stepsBackBtn').onclick =
    backTarget === 'modes' ? showModes : showHome;

  document.getElementById('stepsList').innerHTML = steps.map((s, i) => `
    <div class="step" style="animation-delay:${i * 0.06}s">
      <div class="step-num">${i + 1}</div>
      <div class="step-body">
        <div class="step-text">${t(s.text)}</div>
        ${t(s.note) ? `<div class="step-note">💡 ${t(s.note)}</div>` : ''}
        ${s.photo
          ? `<div class="step-photo"><img src="${s.photo}" alt="Foto ${i+1}" /></div>`
          : `<div class="step-photo"><div class="photo-placeholder">${ui.photoLabel}</div></div>`
        }
      </div>
    </div>
  `).join('');

  showView('stepsView');
}

function showHome() {
  currentGuide = null;
  document.getElementById('searchInput').value = '';
  renderGrid(GUIDES);
  showView('homeView');
}

function showModes() { showView('modesView'); }

  document.getElementById('editModel').value   = g.device?.model  || '';
  document.getElementById('editNumber').value  = g.device?.number || '';

function renderAdminSteps(steps, containerId) {
  const list = steps || adminSteps;
  const id   = containerId || 'adminStepsList';
  document.getElementById(id).innerHTML = list.map((s, i) => `
    <div class="admin-step">
      <div class="admin-step-num">Schritt ${i+1}</div>
      <div class="admin-field">
        <label>Text (DE)</label>
        <textarea rows="2" oninput="updateStep(${i},'text','de',this.value,'${id}')">${s.text?.de||''}</textarea>
      </div>
      <div style="display:flex;gap:6px;">
        <div class="admin-field" style="flex:1;">
          <label>Text (ES)</label>
          <textarea rows="2" oninput="updateStep(${i},'text','es',this.value,'${id}')">${s.text?.es||''}</textarea>
        </div>
        <div class="admin-field" style="flex:1;">
          <label>Text (EN)</label>
          <textarea rows="2" oninput="updateStep(${i},'text','en',this.value,'${id}')">${s.text?.en||''}</textarea>
        </div>
      </div>
      <div class="admin-field">
        <label>Hinweis (DE, optional)</label>
        <input type="text" value="${s.note?.de||''}" oninput="updateStep(${i},'note','de',this.value,'${id}')" />
      </div>
      <div style="display:flex;gap:6px;">
        <div class="admin-field" style="flex:1;">
          <label>Hinweis (ES)</label>
          <input type="text" value="${s.note?.es||''}" oninput="updateStep(${i},'note','es',this.value,'${id}')" />
        </div>
        <div class="admin-field" style="flex:1;">
          <label>Hinweis (EN)</label>
          <input type="text" value="${s.note?.en||''}" oninput="updateStep(${i},'note','en',this.value,'${id}')" />
        </div>
      </div>
      <div class="btn-row">
        ${i > 0 ? `<button class="btn-sm" onclick="moveStep(${i},-1,'${id}')">↑</button>` : ''}
        ${i < list.length-1 ? `<button class="btn-sm" onclick="moveStep(${i},1,'${id}')">↓</button>` : ''}
        <button class="btn-sm danger" onclick="removeStep(${i},'${id}')">✕ Löschen</button>
      </div>
    </div>
  `).join('');
}

function getStepsList(containerId) {
  return containerId && containerId !== 'adminStepsList'
    ? adminModes[parseInt(containerId.replace('modeSteps',''))].steps
    : adminSteps;
}

function updateStep(i, field, lang, value, containerId) {
  const list = getStepsList(containerId);
  if (!list[i][field]) list[i][field] = {de:'',es:'',en:''};
  list[i][field][lang] = value;
}

function adminAddStep(modeIndex) {
  const newStep = { text:{de:'',es:'',en:''}, note:{de:'',es:'',en:''}, photo:null };
  if (modeIndex === -1) {
    adminSteps.push(newStep);
    renderAdminSteps();
  } else {
    adminModes[modeIndex].steps.push(newStep);
    renderAdminSteps(adminModes[modeIndex].steps, `modeSteps${modeIndex}`);
    refreshModeHeader(modeIndex);
  }
}

function removeStep(i, containerId) {
  const list = getStepsList(containerId);
  list.splice(i, 1);
  if (containerId === 'adminStepsList') {
    renderAdminSteps();
  } else {
    const mi = parseInt(containerId.replace('modeSteps',''));
    renderAdminSteps(adminModes[mi].steps, containerId);
    refreshModeHeader(mi);
  }
}

function moveStep(i, dir, containerId) {
  const list = getStepsList(containerId);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  if (containerId === 'adminStepsList') {
    renderAdminSteps();
  } else {
    const mi = parseInt(containerId.replace('modeSteps',''));
    renderAdminSteps(adminModes[mi].steps, containerId);
  }
}

// ── Speichern & Pushen ──────────────────────────────
function adminBuildGuide() {
  const isModes = document.getElementById('editType').value === 'modes';
  const brand  = document.getElementById('editBrand').value.trim();
  const model  = document.getElementById('editModel').value.trim();
  const number = document.getElementById('editNumber').value.trim();
  const os     = document.getElementById('editOs').value.trim();
  const manual = document.getElementById('editManual').value.trim();

  const g = {
    icon: document.getElementById('editIcon').value.trim(),
    name: {
      de: document.getElementById('editNameDe').value.trim(),
      es: document.getElementById('editNameEs').value.trim(),
      en: document.getElementById('editNameEn').value.trim(),
    },
    desc: {
      de: document.getElementById('editDescDe').value.trim(),
      es: document.getElementById('editDescEs').value.trim(),
      en: document.getElementById('editDescEn').value.trim(),
    },
    manual: manual || null,
    device: (brand||model||number||os) ? {
      brand:  brand  || null,
      model:  model  || null,
      number: number || null,
      os:     os     || null,
    } : null,
  };
  if (isModes) g.modes = adminModes;
  else         g.steps = adminSteps;
  return g;
}

async function adminSaveGuide() {
  const token = localStorage.getItem('gh_token');
  if (!token) {
    setPushStatus('error', '⚠️ Bitte zuerst einen GitHub Token eingeben.');
    return;
  }

  const guide = adminBuildGuide();
  if (!guide.name.de) {
    setPushStatus('error', '⚠️ Bitte mindestens einen deutschen Namen eingeben.');
    return;
  }

  // GUIDES aktualisieren
  if (adminEditIndex === -1) GUIDES.push(guide);
  else GUIDES[adminEditIndex] = guide;

  setPushStatus('loading', '⏳ Wird zu GitHub gepusht...');

  try {
    await pushToGitHub(token);
    setPushStatus('success', '✅ Erfolgreich gespeichert und gepusht!');
    renderAdminGuideList();
    renderGrid(GUIDES);
    setTimeout(() => adminCloseEditor(), 1500);
  } catch(e) {
    // Rollback
    if (adminEditIndex === -1) GUIDES.pop();
    else GUIDES[adminEditIndex] = guide;
    setPushStatus('error', '❌ Fehler: ' + e.message);
  }
}

async function adminDeleteGuide() {
  if (adminEditIndex === -1) { adminCloseEditor(); return; }
  if (!confirm('Gerät "' + GUIDES[adminEditIndex].name.de + '" wirklich löschen?')) return;

  const token = localStorage.getItem('gh_token');
  if (!token) { setPushStatus('error', '⚠️ Kein Token gesetzt.'); return; }

  GUIDES.splice(adminEditIndex, 1);
  setPushStatus('loading', '⏳ Wird zu GitHub gepusht...');
  try {
    await pushToGitHub(token);
    setPushStatus('success', '✅ Gelöscht und gepusht!');
    renderAdminGuideList();
    renderGrid(GUIDES);
    setTimeout(() => adminCloseEditor(), 1500);
  } catch(e) {
    setPushStatus('error', '❌ Fehler: ' + e.message);
  }
}

function setPushStatus(type, msg) {
  const el = document.getElementById('pushStatus');
  el.textContent = msg;
  el.className = 'push-status ' + type;
}

async function pushToGitHub(token) {
  const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

  // 1. Aktuelle SHA holen
  const meta = await fetch(apiBase, {
    headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github.v3+json' }
  });
  if (!meta.ok) throw new Error('Datei nicht gefunden (SHA). Status: ' + meta.status);
  const { sha, content: currentB64 } = await meta.json();

  // 2. Aktuellen HTML-Inhalt holen und GUIDES-Block ersetzen
  const currentHtml = decodeURIComponent(escape(atob(currentB64.replace(/\n/g,''))));
  const guidesJson  = JSON.stringify(GUIDES, null, 2);
  const newHtml     = currentHtml.replace(
    /const GUIDES = \[[\s\S]*?\](?=;\s*\/\* ══)/,
    'const GUIDES = ' + guidesJson
  );

  if (newHtml === currentHtml) throw new Error('GUIDES-Block nicht gefunden. Bitte Dateistruktur prüfen.');

  // 3. Push
  const push = await fetch(apiBase, {
    method: 'PUT',
    headers: {
      Authorization: 'token ' + token,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      message: 'Admin: GUIDES aktualisiert',
      content: btoa(unescape(encodeURIComponent(newHtml))),
      sha,
    })
  });
  if (!push.ok) {
    const err = await push.json();
    throw new Error(err.message || 'Push fehlgeschlagen. Status: ' + push.status);
  }
}
